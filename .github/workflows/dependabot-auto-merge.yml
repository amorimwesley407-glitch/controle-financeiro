name: Auto-merge do Dependabot

# Ativa o auto-merge nos PRs do Dependabot que só sobem versão patch ou minor.
# O merge só acontece quando os checks exigidos pelo ruleset (CI e Vercel) ficam verdes.
# Atualizações major continuam esperando revisão manual.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v2
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
