name: controle-financeiro-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: clareza
      POSTGRES_PASSWORD: clareza_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clareza -d controle_financeiro"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
